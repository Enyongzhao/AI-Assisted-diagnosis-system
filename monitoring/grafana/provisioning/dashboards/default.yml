# Grafana dashboard provisioning config.
# Grafana reads this on startup and loads all JSON files from the dashboards/ folder.
# design_doc §8.2

apiVersion: 1

providers:
  - name: "AI Diagnosis Dashboards"
    orgId: 1
    folder: "AI Diagnosis System"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
